<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow / Glass Card -->
  <rect x="56" y="56" width="400" height="400" rx="64" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>
  
  <!-- Screen Monitor / TV Frame -->
  <rect x="96" y="116" width="320" height="220" rx="32" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Screen Play / Broadcast Waves -->
  <circle cx="256" cy="226" r="48" fill="url(#accentGrad)" fill-opacity="0.25"/>
  <polygon points="244,204 278,226 244,248" fill="#38bdf8"/>
  
  <!-- Signal / Broadcast waves -->
  <path d="M196,170 C234,136 278,136 316,170" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M172,146 C226,104 286,104 340,146" fill="none" stroke="#bae6fd" stroke-width="8" stroke-linecap="round" stroke-opacity="0.5"/>
  
  <!-- Stand & Base -->
  <rect x="236" y="336" width="40" height="44" rx="6" fill="#64748b"/>
  <rect x="180" y="380" width="152" height="18" rx="9" fill="#94a3b8"/>
  
  <!-- Billing Badge -->
  <circle cx="370" cy="340" r="48" fill="#10b981" stroke="#0f172a" stroke-width="8"/>
  <text x="370" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">₴</text>
</svg>
